<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <title>Retrench - Keep or kill AI features at the unit-economics line</title>

  <!-- Background -->
  <rect width="1200" height="420" fill="#F4EFE6"/>
  <rect x="0" y="0" width="1200" height="420" fill="#E8E0D2" opacity="0.35"/>

  <!-- Dashed vertical rails -->
  <g stroke="#C4B8A5" stroke-width="1" stroke-dasharray="4 10" opacity="0.55">
    <line x1="80" y1="0" x2="80" y2="420"/>
    <line x1="140" y1="0" x2="140" y2="420"/>
    <line x1="1060" y1="0" x2="1060" y2="420"/>
    <line x1="1120" y1="0" x2="1120" y2="420"/>
  </g>

  <!-- Soft orbs -->
  <circle cx="180" cy="90" r="36" fill="#F59E0B" opacity="0.12"/>
  <circle cx="1040" cy="320" r="48" fill="#DC2626" opacity="0.08"/>

  <!-- App window shadow -->
  <rect x="218" y="82" width="780" height="280" rx="14" fill="#1C1917" opacity="0.08"/>

  <!-- App window -->
  <rect x="210" y="70" width="780" height="280" rx="14" fill="#FFFCF7" stroke="#E7E0D4" stroke-width="1.5"/>

  <!-- Title bar -->
  <path d="M210 84c0-7.7 6.3-14 14-14h752c7.7 0 14 6.3 14 14v30H210V84z" fill="#FAF7F1"/>
  <rect x="210" y="98" width="780" height="16" fill="#FAF7F1"/>
  <circle cx="238" cy="92" r="6" fill="#FF5F57"/>
  <circle cx="258" cy="92" r="6" fill="#FEBC2E"/>
  <circle cx="278" cy="92" r="6" fill="#28C840"/>
  <text x="304" y="97" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1C1917">Retrench</text>

  <!-- Mini mark -->
  <rect x="950" y="78" width="24" height="24" rx="6" fill="#B45309"/>
  <path d="M956 94l6-8 6 8" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Headline -->
  <text x="600" y="175" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#1C1917">Keep or kill <tspan fill="#B45309">AI features</tspan></text>
  <text x="600" y="218" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#57534E">at the <tspan fill="#B45309" font-weight="700">unit-economics</tspan> line</text>

  <!-- Status chips -->
  <rect x="330" y="250" width="86" height="30" rx="15" fill="#DCFCE7"/>
  <text x="373" y="270" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#166534">KEEP</text>

  <rect x="430" y="250" width="86" height="30" rx="15" fill="#FEF3C7"/>
  <text x="473" y="270" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#92400E">FIX</text>

  <rect x="530" y="250" width="86" height="30" rx="15" fill="#FEE2E2"/>
  <text x="573" y="270" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#991B1B">KILL</text>

  <!-- Margin chart -->
  <text x="640" y="260" font-family="Consolas, Menlo, monospace" font-size="11" fill="#78716C">margin</text>
  <line x1="640" y1="276" x2="850" y2="276" stroke="#A8A29E" stroke-width="1" stroke-dasharray="3 4" opacity="0.7"/>
  <path d="M640 276 C680 258, 720 288, 760 266 C790 252, 820 282, 850 270" fill="none" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
  <circle cx="850" cy="270" r="5" fill="#DC2626"/>

  <!-- Blinking cursor (static fallback; CSS animate below for browsers that allow it) -->
  <rect x="718" y="198" width="2" height="18" fill="#B45309">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- Soft pulse on KEEP chip -->
  <rect x="330" y="250" width="86" height="30" rx="15" fill="#16A34A" opacity="0">
    <animate attributeName="opacity" values="0;0.12;0" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <!-- Integration pills -->
  <rect x="300" y="372" width="110" height="28" rx="14" fill="#FFFFFF" stroke="#E7E0D4"/>
  <text x="355" y="390" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#44403C">neatlogs</text>

  <rect x="430" y="372" width="110" height="28" rx="14" fill="#FFFFFF" stroke="#E7E0D4"/>
  <text x="485" y="390" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#44403C">entire.io</text>

  <rect x="560" y="372" width="110" height="28" rx="14" fill="#FFFFFF" stroke="#E7E0D4"/>
  <text x="615" y="390" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#44403C">cfo.ai</text>

  <rect x="690" y="372" width="210" height="28" rx="14" fill="#1C1917"/>
  <text x="795" y="390" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#FAFAF9">runtime - change - money</text>
</svg>

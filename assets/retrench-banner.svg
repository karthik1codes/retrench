<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Retrench - keep or kill AI features at the unit-economics line">
  <!-- shadcn/ui muted page -->
  <rect width="1200" height="420" fill="#fafafa"/>

  <!-- subtle grid -->
  <g stroke="#e4e4e7" stroke-width="1" opacity="0.9">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
  </g>

  <!-- shadcn card -->
  <rect x="180" y="56" width="840" height="268" rx="16" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>

  <!-- Title: centered logo + Retrench -->
  <g transform="translate(600 92)">
    <g transform="translate(-70 -14)">
      <rect width="28" height="28" rx="7" fill="#09090b"/>
      <path
        d="M8 19 L14 10 L20 19"
        fill="none"
        stroke="#fafafa"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <text
        x="40"
        y="14"
        dominant-baseline="central"
        font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="18"
        font-weight="700"
        letter-spacing="-0.03em"
        fill="#09090b"
      >Retrench</text>
    </g>
  </g>

  <line x1="180" y1="120" x2="1020" y2="120" stroke="#e4e4e7" stroke-width="1"/>

  <text
    x="600"
    y="178"
    text-anchor="middle"
    font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="34"
    font-weight="700"
    letter-spacing="-0.03em"
    fill="#09090b"
  >Keep or kill AI features</text>

  <text
    x="600"
    y="216"
    text-anchor="middle"
    font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="18"
    font-weight="500"
    fill="#71717a"
  >at the unit-economics line</text>

  <!-- shadcn-style badges -->
  <g font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">
    <g transform="translate(390 248)">
      <rect width="88" height="30" rx="8" fill="#09090b"/>
      <text x="44" y="20" text-anchor="middle" fill="#fafafa">KEEP</text>
    </g>
    <g transform="translate(494 248)">
      <rect width="88" height="30" rx="8" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
      <text x="44" y="20" text-anchor="middle" fill="#09090b">FIX</text>
    </g>
    <g transform="translate(598 248)">
      <rect width="88" height="30" rx="8" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
      <text x="44" y="20" text-anchor="middle" fill="#dc2626">KILL</text>
    </g>
    <g transform="translate(702 248)">
      <rect width="108" height="30" rx="8" fill="#f4f4f5"/>
      <text x="54" y="20" text-anchor="middle" fill="#52525b">margin</text>
    </g>
  </g>

  <!-- unit-economics cut line -->
  <g transform="translate(360 300)">
    <line x1="0" y1="12" x2="480" y2="12" stroke="#e4e4e7" stroke-width="2" stroke-dasharray="4 6"/>
    <path
      d="M0 12 C80 0, 160 28, 240 8 C320 -8, 400 24, 480 12"
      fill="none"
      stroke="#09090b"
      stroke-width="2.5"
      stroke-linecap="round"
    />
    <circle cx="360" cy="10" r="4" fill="#dc2626"/>
  </g>

  <!-- integration chips -->
  <g font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">
    <g transform="translate(300 360)">
      <rect width="120" height="28" rx="8" fill="#ffffff" stroke="#e4e4e7"/>
      <text x="60" y="18" text-anchor="middle" fill="#3f3f46">neatlogs</text>
    </g>
    <g transform="translate(440 360)">
      <rect width="120" height="28" rx="8" fill="#ffffff" stroke="#e4e4e7"/>
      <text x="60" y="18" text-anchor="middle" fill="#3f3f46">entire.io</text>
    </g>
    <g transform="translate(580 360)">
      <rect width="120" height="28" rx="8" fill="#ffffff" stroke="#e4e4e7"/>
      <text x="60" y="18" text-anchor="middle" fill="#3f3f46">cfo.ai</text>
    </g>
    <g transform="translate(720 360)">
      <rect width="200" height="28" rx="8" fill="#09090b"/>
      <text x="100" y="18" text-anchor="middle" fill="#fafafa">runtime - change - money</text>
    </g>
  </g>
</svg>

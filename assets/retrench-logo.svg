<svg xmlns="http://www.w3.org/2000/svg" width="320" height="72" viewBox="0 0 320 72" role="img" aria-label="Retrench">
  <!-- shadcn/ui surface: bg-background + border -->
  <rect width="320" height="72" rx="12" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>

  <!--
    Centered cluster (icon 36 + gap 12 + "Retrench" ~128 ≈ 176 wide).
    Canvas center = 160. Offset group by -88 so mark + name sit dead center.
  -->
  <g transform="translate(160 36)">
    <g transform="translate(-88 -18)">
      <!-- shadcn primary mark -->
      <rect width="36" height="36" rx="8" fill="#09090b"/>
      <!-- cut-line glyph -->
      <path
        d="M10 24 L18 12 L26 24"
        fill="none"
        stroke="#fafafa"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <!-- name -->
      <text
        x="48"
        y="18"
        dominant-baseline="central"
        font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="28"
        font-weight="700"
        letter-spacing="-0.04em"
        fill="#09090b"
      >Retrench</text>
    </g>
  </g>
</svg>

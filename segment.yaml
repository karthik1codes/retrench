# Signal Scout — segment DSL (only human input)
# Sentence form: "Series A–B fintech SaaS, 20–200 employees, US"

dsl_text: "Series A–B fintech SaaS, 20–200 employees, US"

# CrustData filters — field paths must match Company Search docs
crustdata_filters:
  - field: locations.country
    type: "="
    value: "USA"
  - field: funding.last_round_type
    type: "in"
    value: ["series_a", "series_b"]
  - field: headcount.total
    type: ">"
    value: 20
  - field: headcount.total
    type: "<"
    value: 200
  - field: funding.last_fundraise_date
    type: ">"
    value: "2024-01-01"

# Omit ranked `search` when using sorts (API forbids combining them).
# Uncomment for NL discovery instead of date sort:
# search:
#   query: "fintech SaaS"
#   mode: hybrid

crustdata_fields:
  - basic_info.name
  - basic_info.primary_domain
  - basic_info.employee_count_range
  - funding
  - headcount.total
  - headcount.growth_percent
  - locations.country
  - taxonomy.professional_network_industry

triggers:
  funding:
    enabled: true
    max_age_days: 14
    min_severity: 80
  headcount_surge:
    enabled: true
    min_pct_30d: 10
    gtm_titles_only: true
    min_severity: 65
  exec_hire:
    enabled: true
    titles: ["VP Sales", "CRO", "Head of Sales", "VP Marketing", "CMO"]
    max_tenure_days: 45
    min_severity: 75
  tech_change:
    enabled: false
    min_severity: 60

archive_below_severity: 70
credit_budget_per_cycle: 50
cadence_hours: 6
limit_companies: 5
max_signals_per_cycle: 5
region: US
